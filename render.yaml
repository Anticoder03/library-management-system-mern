# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One Web Service serves BOTH the API and the built React client.
# Express serves client/dist when NODE_ENV=production, so no separate
# Static Site, CORS origin or VITE_API_URL is needed for this setup.
#
# Render does not offer managed MongoDB. Create a free MongoDB Atlas
# cluster first and paste its connection string into MONGO_URI when
# Render prompts for the secret values below.

services:
  - type: web
    name: smart-library
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    autoDeploy: true

    buildCommand: npm ci --omit=dev && npm --prefix server ci --omit=dev && npm --prefix client ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      # Fill these in the Render dashboard when the blueprint is applied.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Optional. Render exposes RENDER_EXTERNAL_URL automatically and the
      # server uses that when this is blank. Set it explicitly for a custom
      # domain or if you deploy the API and frontend as two services.
      - key: CLIENT_URL
        sync: false
